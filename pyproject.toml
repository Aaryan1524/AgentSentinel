[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-sentinel"
version = "0.1.0"
description = "Portable notifications for AI coding-agent events"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "AgentSentinel contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
sentinel = "agent_sentinel.cli:main"
sentinel-claude-hook = "agent_sentinel.adapters.claude_code:main"
sentinel-gemini-hook = "agent_sentinel.adapters.gemini_cli:main"
sentinel-codex-notify = "agent_sentinel.adapters.codex:main"
sentinel-grok-hook = "agent_sentinel.adapters.grok:main"
sentinel-aider-notify = "agent_sentinel.adapters.aider:main"

[tool.setuptools.packages.find]
where = ["src"]
